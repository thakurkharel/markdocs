services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: markdocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markdocs}
      POSTGRES_DB: markdocs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markdocs"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://markdocs:${POSTGRES_PASSWORD:-markdocs}@db:5432/markdocs
      DIRECT_URL: postgresql://markdocs:${POSTGRES_PASSWORD:-markdocs}@db:5432/markdocs
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      PORT: "3001"

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: markdocs-mcp
    environment:
      MARKDOCS_URL: http://app:3001
      MARKDOCS_API_KEY: ${MARKDOCS_API_KEY:-}
    depends_on:
      - app
    profiles:
      - mcp

volumes:
  pgdata:
